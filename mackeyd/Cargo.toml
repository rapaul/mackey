[package]
name = "mackeyd"
description = "The mackey daemon: grabs keyboards via evdev, emits via uinput."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mackeyd"
path = "src/main.rs"

[dependencies]
mackey-core.workspace = true
signal-hook = "0.3"

[dev-dependencies]
toml = "0.8"

# --- Debian packaging (cargo-deb) -------------------------------------------
# Ships /usr/bin/mackeyd and the (disabled) systemd unit. The post-install
# scriptlet creates the mackey system user/group; it never enables the service.
# cargo-deb resolves these paths relative to this crate dir, hence ../packaging.
[package.metadata.deb]
maintainer = "Richard Paul <richard.a.paul@gmail.com>"
copyright = "2026, Richard Paul"
section = "utils"
priority = "optional"
# Built on Fedora where dpkg-shlibdeps is unavailable, so the $auto resolver
# yields nothing. The binary is dynamically linked against glibc -> libc6.
depends = "libc6"
maintainer-scripts = "../packaging/maintainer"
extended-description = "macOS-style keyboard shortcuts on Linux (GNOME/Wayland). This package ships the mackey daemon."
assets = [
    ["target/release/mackeyd", "usr/bin/", "755"],
    ["../packaging/mackey.service", "usr/lib/systemd/system/", "644"],
]

# --- RPM packaging (cargo-generate-rpm) -------------------------------------
# cargo-generate-rpm wants the scriptlet inline (no file include in 0.21) and
# resolves asset paths from the workspace root. The post_install_script below is
# an exact copy of packaging/maintainer/postinst; the `postinst_in_sync` test
# fails if the two ever drift.
[package.metadata.generate-rpm]
summary = "macOS-style keyboard shortcuts on Linux (GNOME/Wayland)"
post_install_script = '''
#!/bin/sh
# mackey post-install scriptlet (shared by the .deb and .rpm).
#
# Creates the dedicated, unprivileged system user/group the daemon runs as.
# Idempotent: re-running it is a no-op. Per the security contract it deliberately
# does NOT enable or start mackey.service, never modifies any login user's group
# membership, and never touches GNOME settings. Its only side effects are
# creating the mackey user/group and the files already dropped under /usr.
set -e

getent group mackey >/dev/null 2>&1 || groupadd --system mackey
getent passwd mackey >/dev/null 2>&1 || \
    useradd --system --no-create-home --gid mackey --shell /usr/sbin/nologin mackey

exit 0
'''
assets = [
    { source = "target/release/mackeyd", dest = "/usr/bin/mackeyd", mode = "0755" },
    { source = "packaging/mackey.service", dest = "/usr/lib/systemd/system/mackey.service", mode = "0644" },
]
