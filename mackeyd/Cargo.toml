[package]
name = "mackeyd"
description = "The mackey daemon: grabs keyboards via evdev, emits via uinput."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mackeyd"
path = "src/main.rs"

[dependencies]
evdev = "0.13"
inotify = { version = "0.11", default-features = false }
mackey-core.workspace = true
signal-hook = "0.3"
zbus = "5"

[dev-dependencies]
toml = "0.8"

# --- Debian packaging (cargo-deb) -------------------------------------------
# Ships /usr/bin/mackeyd and the systemd unit. The post-install scriptlet creates
# the mackey system user/group and enables+starts the service (restarting it on
# upgrade); the pre-removal scriptlet stops+disables it. cargo-deb resolves these
# paths relative to this crate dir, hence ../packaging, and auto-includes the
# postinst/prerm under maintainer-scripts.
[package.metadata.deb]
maintainer = "Richard Paul <richard.a.paul@gmail.com>"
copyright = "2026, Richard Paul"
section = "utils"
priority = "optional"
# Built on Fedora where dpkg-shlibdeps is unavailable, so the $auto resolver
# yields nothing. The binary is dynamically linked against glibc -> libc6.
depends = "libc6, libgtk-4-1, libadwaita-1-0"
maintainer-scripts = "../packaging/maintainer"
extended-description = "macOS-style keyboard shortcuts on Linux (GNOME/Wayland). This package ships the mackey daemon and the mackey setup GUI."
assets = [
    ["target/release/mackeyd", "usr/bin/", "755"],
    ["target/release/mackey", "usr/bin/", "755"],
    ["../packaging/mackey.desktop", "usr/share/applications/", "644"],
    ["../packaging/mackey.service", "usr/lib/systemd/system/", "644"],
    ["../packaging/udev/90-mackey.rules", "usr/lib/udev/rules.d/", "644"],
    ["../packaging/modules-load/mackey.conf", "usr/lib/modules-load.d/", "644"],
    ["../packaging/dbus/app.mackey.conf", "usr/share/dbus-1/system.d/", "644"],
    ["../packaging/polkit/app.mackey.policy", "usr/share/polkit-1/actions/", "644"],
    ["../packaging/mackey-service-control", "usr/libexec/", "755"],
    ["../target/gnome-extension/mackey@mackey.app/metadata.json", "usr/share/gnome-shell/extensions/mackey@mackey.app/", "644"],
    ["../target/gnome-extension/mackey@mackey.app/extension.js", "usr/share/gnome-shell/extensions/mackey@mackey.app/", "644"],
]

# --- RPM packaging (cargo-generate-rpm) -------------------------------------
# cargo-generate-rpm wants the scriptlets inline (no file include in 0.21) and
# resolves asset paths from the workspace root. post_install_script is an exact
# copy of packaging/maintainer/postinst and pre_uninstall_script of
# packaging/maintainer/prerm; the `postinst_in_sync` test fails if either drifts.
[package.metadata.generate-rpm]
summary = "macOS-style keyboard shortcuts on Linux (GNOME/Wayland)"
post_install_script = '''
#!/bin/sh
# mackey post-install scriptlet (shared by the .deb and .rpm).
#
# Creates the dedicated, unprivileged system user/group the daemon runs as,
# loads uinput, and applies the udev rules so device access works immediately.
# On first install it enables and starts mackey.service; on upgrade/reinstall it
# restarts the already-running daemon so the new binary takes effect. It never
# modifies any login user's group membership and never touches GNOME settings.
set -e

getent group mackey >/dev/null 2>&1 || groupadd --system mackey
getent passwd mackey >/dev/null 2>&1 || \
    useradd --system --no-create-home --gid mackey --shell /usr/sbin/nologin mackey

# Load uinput now (modules-load.d handles subsequent boots) and apply the udev
# rules so /dev/uinput and keyboard nodes pick up the mackey group immediately.
modprobe uinput >/dev/null 2>&1 || true
if command -v udevadm >/dev/null 2>&1; then
    udevadm control --reload >/dev/null 2>&1 || true
    udevadm trigger >/dev/null 2>&1 || true
fi

# Reload the system bus so it picks up our dropped-in dbus policy
# (app.mackey.conf). Without this the running bus stays unaware of the policy
# until the next reboot, and the daemon's attempt to own
# app.mackey.FocusTracker is refused — breaking focus tracking and the per-app
# keymaps that depend on it. Drop-in files are inert until a reload.
systemctl reload dbus.service >/dev/null 2>&1 || true

# Pick up the freshly installed unit file before we enable/start it.
systemctl daemon-reload >/dev/null 2>&1 || true

# First install: enable + start so the daemon runs now and on every boot.
# Upgrade/reinstall: try-restart so the new binary takes effect (this never
# starts a unit the user has since stopped). Install vs upgrade is detected per
# packager:
#   - .deb (cargo-deb): postinst runs with $1=configure and $2=old version on upgrade.
#   - .rpm (cargo-generate-rpm): %post runs with $1=1 on install, $1>=2 on upgrade.
if [ "$1" = configure ] && [ -z "$2" ]; then
    systemctl enable --now mackey.service >/dev/null 2>&1 || true
elif [ "$1" = configure ]; then
    systemctl try-restart mackey.service >/dev/null 2>&1 || true
elif [ "$1" = 1 ]; then
    systemctl enable --now mackey.service >/dev/null 2>&1 || true
elif [ "$1" -ge 2 ] 2>/dev/null; then
    systemctl try-restart mackey.service >/dev/null 2>&1 || true
fi

exit 0
'''
pre_uninstall_script = '''
#!/bin/sh
# mackey pre-removal scriptlet (shared by the .deb and .rpm).
#
# On package removal (NOT upgrade) stop and disable mackey.service — the
# symmetric counterpart to the enable+start the post-install does on install.
# On upgrade the unit is left running so the post-install's restart can swap in
# the new binary without a gap. Install vs upgrade is detected per packager:
#   - .deb (cargo-deb): prerm runs with $1=remove on removal, $1=upgrade on upgrade.
#   - .rpm (cargo-generate-rpm): %preun runs with $1=0 on final removal, $1=1 on upgrade.
set -e

if [ "$1" = remove ] || [ "$1" = 0 ]; then
    systemctl --no-reload disable --now mackey.service >/dev/null 2>&1 || true
fi

exit 0
'''
assets = [
    { source = "target/release/mackeyd", dest = "/usr/bin/mackeyd", mode = "0755" },
    { source = "target/release/mackey", dest = "/usr/bin/mackey", mode = "0755" },
    { source = "packaging/mackey.desktop", dest = "/usr/share/applications/mackey.desktop", mode = "0644" },
    { source = "packaging/mackey.service", dest = "/usr/lib/systemd/system/mackey.service", mode = "0644" },
    { source = "packaging/udev/90-mackey.rules", dest = "/usr/lib/udev/rules.d/90-mackey.rules", mode = "0644" },
    { source = "packaging/modules-load/mackey.conf", dest = "/usr/lib/modules-load.d/mackey.conf", mode = "0644" },
    { source = "packaging/dbus/app.mackey.conf", dest = "/usr/share/dbus-1/system.d/app.mackey.conf", mode = "0644" },
    { source = "packaging/polkit/app.mackey.policy", dest = "/usr/share/polkit-1/actions/app.mackey.policy", mode = "0644" },
    { source = "packaging/mackey-service-control", dest = "/usr/libexec/mackey-service-control", mode = "0755" },
    { source = "target/gnome-extension/mackey@mackey.app/metadata.json", dest = "/usr/share/gnome-shell/extensions/mackey@mackey.app/metadata.json", mode = "0644" },
    { source = "target/gnome-extension/mackey@mackey.app/extension.js", dest = "/usr/share/gnome-shell/extensions/mackey@mackey.app/extension.js", mode = "0644" },
]
