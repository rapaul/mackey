[workspace]
resolver = "2"
members = ["mackey-core", "mackeyd", "mackey-gui"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Richard Paul <richard.a.paul@gmail.com>"]
repository = "https://github.com/richardapaul/mackey"
rust-version = "1.96"

[workspace.dependencies]
mackey-core = { path = "mackey-core", version = "0.7.0" }

# Strip release binaries so the packaged mackeyd/mackey carry no debug symbols
# (M11 promotes the unstripped-binary linter warning to an error).
[profile.release]
strip = true
