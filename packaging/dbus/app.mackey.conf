<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the mackey daemon may own the focus-tracker name. -->
  <policy user="mackey">
    <allow own="app.mackey.FocusTracker"/>
  </policy>

  <!-- Any local user may call ONLY UpdateFocus on it; no other member or
       interface is permitted. The daemon additionally rejects callers whose
       uid is not the active local-seat user. -->
  <policy context="default">
    <allow send_destination="app.mackey.FocusTracker"
           send_interface="app.mackey.FocusTracker"
           send_member="UpdateFocus"/>
  </policy>
</busconfig>
